<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TastyCart | Food Ordering</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ✅ ORDER SUCCESS MODAL -->
<div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Order Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="successModalBody">
        <!-- Order summary goes here -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- ✅ HEADER -->
<header class="bg-danger text-white p-3">
  <div class="container d-flex justify-content-between align-items-center">

    <h1 class="m-0">TastyCart</h1>

    <nav class="d-flex align-items-center gap-4">
      <a href="#menu" class="text-white text-decoration-none">Menu</a>
      <a href="#cart" class="text-white text-decoration-none">Cart</a>

      <!-- Orders Dropdown -->
      <div class="dropdown">
        <a class="text-white dropdown-toggle text-decoration-none"
           href="#"
           data-bs-toggle="dropdown">
          Orders
          <span class="badge bg-warning text-dark ms-1" id="order-count">0</span>
        </a>

        <ul class="dropdown-menu dropdown-menu-end p-2"
            id="order-history-dropdown"
            style="width:300px; max-height:400px; overflow-y:auto;">
        </ul>
      </div>
    </nav>

  </div>
</header>

<!-- ✅ FILTER BUTTONS -->
<div class="text-center my-4">
  <button class="btn btn-outline-success me-2" onclick="filterType('veg')">Veg</button>
  <button class="btn btn-outline-danger me-2" onclick="filterType('nonveg')">Non-Veg</button>
  <button class="btn btn-outline-dark" onclick="filterType('all')">All</button>
</div>

<!-- ✅ MAIN CONTENT -->
<main class="container my-4">

  <!-- SEARCH -->
  <input type="text"
         id="search"
         class="form-control mb-4"
         placeholder="Search food..."
         onkeyup="filterFood()">

  <!-- MENU -->
  <section id="menu">
    <h2 class="text-center mb-4">Our Menu</h2>

    <!-- Skeleton Loader -->
    <div id="skeleton" class="row">
      <div class="col-md-4 mb-4"><div class="skeleton-card"></div></div>
      <div class="col-md-4 mb-4"><div class="skeleton-card"></div></div>
      <div class="col-md-4 mb-4"><div class="skeleton-card"></div></div>
    </div>

    <!-- ✅ FOOD LIST (JS WILL RENDER HERE) -->
    <div id="food-list" class="row g-4"></div>
  </section>

  <!-- ✅ ORDER DETAILS MODAL -->
  <div class="modal fade" id="orderModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>Order Details</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="orderForm" onsubmit="return validateOrder()">
            <input type="text" id="name" class="form-control mb-3" placeholder="Name">
            <input type="tel" id="phone" class="form-control mb-3" placeholder="Phone">
            <textarea id="address" class="form-control mb-3" placeholder="Address"></textarea>
            <button class="btn btn-success w-100">Confirm Order</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ CART -->
  <section id="cart" class="mt-5">
    <h2 class="text-center">Your Cart</h2>
    <ul class="list-group my-3" id="cart-items"></ul>
    <h4 class="text-end">Total: ₹<span id="total">0</span></h4>
    <button class="btn btn-success w-100 mt-3"
            data-bs-toggle="modal"
            data-bs-target="#orderModal">
      Place Order
    </button>
  </section>

</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
  © 2025 TastyCart | Simple Food Ordering Website
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
